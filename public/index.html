<!DOCTYPE html>
<html lang="en">
<script>
    self.__uv$config = {
        prefix: '/service/',
        bare: '/bare/',
        encodeUrl: Ultraviolet.codec.xor.encode,
        decodeUrl: Ultraviolet.codec.xor.decode,
        handler: '/uv/uv.handler.js',
        bundle: '/uv/uv.bundle.js',
        config: '/uv/uv.config.js',
        sw: '/uv/uv.sw.js'
    };
</script>
<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>   
<head>
    <title>Isreal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        /* CSS Variables for easy customization */
        :root {
            --bg-color: #202124; /* Dark mode default */
            --text-color: #e8eaed;
            --input-bg: #303134;
            --input-border: #5f6368;
            --hover-bg: #3c4043;
            --button-bg: #303134;
            --button-hover: #3c4043;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            /* Custom Background Image */
            background-image: url('https://images.unsplash.com/photo-1477346611705-65d1883cee1e?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Overlay to ensure text readability over background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Dark overlay */
            z-index: -1;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
            align-items: center;
            gap: 15px;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 13px;
            opacity: 0.85;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #8ab4f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #202124;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px; /* Visual adjustment */
        }

        .logo {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: -2px;
            color: white; /* Google colors usually, but white looks good on dark BG */
        }

        .search-container {
            width: 100%;
            max-width: 580px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 12px 45px;
            border-radius: 24px;
            border: 1px solid var(--input-border);
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: white;
            font-size: 16px;
            outline: none;
            transition: background-color 0.2s;
        }

.search-bar:focus {
    background-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
}
